appId: com.bodydebugger.app
productName: Body Debugger

directories:
  output: dist
  buildResources: electron/resources

# Everything the main/preload/renderer need is bundled into out/ by electron-vite;
# production node_modules are added automatically (electron-updater later).
files:
  - out/**
  - package.json

asar: true

win:
  icon: electron/resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: installer.nsh
  artifactName: Body-Debugger-Setup-${version}.${ext}

publish:
  provider: github
  owner: proto0654
  repo: body-debugger-releases
  # A stable tag publishes a normal release; the dev publish script overrides
  # this with EP_PRE_RELEASE=true.
  releaseType: release
