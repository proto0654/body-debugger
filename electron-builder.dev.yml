# Side-by-side development build. It shares the renderer/main bundle with the
# production app but gets its own identity, profile, updater cache and feed.
#
# This is intentionally standalone rather than `extends: electron-builder.yml`:
# electron-builder concatenates `publish` arrays on extend, which would publish
# the same release twice. Keep the shared fields in sync with the prod config.
appId: com.bodydebugger.app.dev
productName: Body Debugger Dev

directories:
  output: dist-dev
  buildResources: electron/resources

files:
  - out/**
  - package.json

asar: true

# `name` controls updaterCacheDirName; without it prod and dev would overwrite
# each other's downloaded installer. `productName` controls app.getName(),
# userData and the window title.
extraMetadata:
  name: body-debugger-dev
  productName: Body Debugger Dev

win:
  icon: electron/resources/icon-dev.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: installer.nsh
  artifactName: Body-Debugger-Dev-Setup-${version}.${ext}
  shortcutName: Body Debugger Dev
  uninstallDisplayName: Body Debugger Dev

# Same unsigned arm64 zip path as prod; separate product name and updater cache.
mac:
  icon: electron/resources/icon-dev.png
  target:
    - target: zip
      arch:
        - arm64
  artifactName: Body-Debugger-Dev-${version}-mac-arm64.${ext}
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  category: public.app-category.healthcare-fitness

# Portable dev AppImage with its own binary and artifact name so it cannot be
# mistaken for, or clash with, the prod AppImage on the same machine.
linux:
  icon: electron/resources/icon-dev.png
  category: Utility
  executableName: body-debugger-dev
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: Body-Debugger-Dev-${version}-linux-x86_64.${ext}
  desktop:
    entry:
      Name: Body Debugger Dev
      Comment: Desktop tray app for short desk workouts — Body Debugger

# Never let a manual dev publish look like a stable release. The release repo is
# shared with prod; prod ignores prereleases and the dev updater reads dev.yml.
publish:
  provider: github
  owner: proto0654
  repo: body-debugger-releases
  releaseType: prerelease
  channel: dev
